<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>robometrics viewer</title>
<style>
  /* Light, quiet, functional. System fonts only -- no webfonts, renders the same
     offline. Priority is a usable layout, not visual polish. */
  :root {
    --bg:     #ffffff;
    --fg:     #202124;   /* Google grey-900 for text */
    --muted:  #5f6368;   /* Google grey-700 */
    --faint:  #9aa0a6;   /* Google grey-500 */
    --line:   #ecedef;
    --grid:   #f1f3f4;
    --hover:  #f8f9fa;
    --sel:    #e8f0fe;   /* Google light blue */
    --accent: #1a73e8;   /* Google blue */
    --thresh: #b06000;
    --worst:  #d93025;   /* Google red */
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--sans);
    font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  .num { font-variant-numeric: tabular-nums; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* ---- load state ---- */
  #drop { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  #drop.hidden { display: none; }
  #dropbox { max-width: 520px; }
  #dropbox h1 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
  #dropbox p { color: var(--muted); margin: 6px 0; }
  body.dragover #dropbox h1 { color: var(--accent); }
  .btn {
    display: inline-block; background: #fff; border: 1px solid #d7dbe0; color: var(--fg);
    font: inherit; font-size: 12px; padding: 5px 12px; border-radius: 6px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.active { background: var(--fg); color: #fff; border-color: var(--fg); }
  #err { color: var(--worst); margin-top: 12px; min-height: 1.2em; }

  /* ---- app shell ---- */
  #app { flex: 1; display: none; flex-direction: column; min-height: 0; }
  #app.shown { display: flex; }

  header {
    border-bottom: 1px solid var(--line); padding: 12px 20px;
    display: flex; align-items: baseline; gap: 28px; flex-wrap: wrap;
  }
  .stats { display: flex; gap: 30px; flex-wrap: wrap; align-items: baseline; }
  .stat { display: flex; flex-direction: column; gap: 1px; }
  .stat .v { font-size: 22px; font-weight: 500; letter-spacing: -.01em; }
  .stat .k { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  header .meta { margin-left: auto; color: var(--faint); font-size: 11px; text-align: right; align-self: center; }
  header .load { align-self: center; }

  main { flex: 1; display: flex; min-height: 0; }

  /* ---- left: query + list ---- */
  #left { width: 320px; min-width: 240px; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .controls { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  #search {
    background: #fff; border: 1px solid #dfe3e8; color: var(--fg); font: inherit;
    padding: 7px 9px; border-radius: 6px; width: 100%;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  .hint { color: var(--faint); font-size: 11px; }
  #count { color: var(--faint); font-size: 11px; }

  #list { overflow-y: auto; flex: 1; }
  .item {
    padding: 8px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px;
    border-bottom: 1px solid var(--line); user-select: none;
  }
  .item:hover { background: var(--hover); }
  .item.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
  .item.sel .name { font-weight: 600; }
  .item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); }
  .item .num { color: var(--muted); white-space: nowrap; }
  .item.flagged .num { color: var(--worst); }
  .empty-list { padding: 18px 12px; color: var(--muted); }

  /* ---- right: action bar / graph / info ---- */
  #right { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #actionbar {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 20px; border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  #actionbar .hint { margin-left: 4px; }
  #detail { flex: 1; overflow: auto; padding: 16px 20px; }
  #detail h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; word-break: break-all; }
  #detail .sub { color: var(--faint); font-size: 11px; margin-bottom: 14px; word-break: break-all; }

  .chart-wrap { position: relative; }
  svg.chart { width: 100%; height: auto; display: block; cursor: grab; user-select: none; touch-action: none; }
  svg.chart.grabbing { cursor: grabbing; }
  .charthelp { color: var(--faint); font-size: 11px; margin-top: 4px; }
  .empty { color: var(--muted); padding: 48px 12px; text-align: center; }

  /* Live on-page chart styling for grid + axis labels; the marks (lines, worst
     dot, threshold, crosshair) are styled by the CHART_CSS embedded in the SVG
     so exported/copied SVGs keep their look. */
  .grid { stroke: #ecedf0; stroke-width: 1; }
  .axis-label { fill: #b0b6bd; font-size: 10px; font-family: var(--sans); }

  #chartTip {
    position: absolute; pointer-events: none; background: #10151b; color: #fff;
    font-size: 11px; padding: 3px 7px; border-radius: 4px; white-space: nowrap;
  }
  #chartTip[hidden] { display: none; }

  svg.chart:focus { outline: 2px solid #cfe0ff; outline-offset: -2px; }
  .chart-tools {
    position: absolute; top: 2px; right: 4px; display: flex; gap: 12px; align-items: center;
    font-size: 11px; color: var(--faint); opacity: .5; transition: opacity .12s;
  }
  .chart-wrap:hover .chart-tools, .chart-wrap:focus-within .chart-tools { opacity: 1; }
  .chart-tools span[data-act] { cursor: pointer; }
  .chart-tools span[data-act]:hover { color: var(--accent); }
  .chart-tools span[data-act].on { color: var(--accent); font-weight: 600; }
  .toolmsg { position: absolute; right: 100%; top: 0; margin-right: 12px; white-space: nowrap; color: var(--faint); }
  .cmp-head .tgl { cursor: pointer; }
  .cmp-head .tgl:hover { text-decoration: underline; }
  .cmp-head .tgl.off { opacity: .35; text-decoration: line-through; }


  /* ---- info panel (below the graph) ---- */
  .infopanel { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 16px; }
  .fields { display: flex; gap: 34px; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 1px; }
  .field .k { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .field .v { font-size: 20px; font-weight: 500; }
  .field .v.na { color: var(--faint); font-weight: 500; }
  .field .v.reason { color: var(--thresh); font-size: 15px; font-weight: 600; }
  .spanlist { margin-top: 14px; font-size: 12px; color: var(--muted); }

  /* ---- compare mode ---- */
  #compareBar { padding: 6px 12px 10px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
  #compareBar[hidden] { display: none; }   /* author display:flex would otherwise beat the hidden attribute */
  .cbrow { display: flex; align-items: center; gap: 8px; }
  .cblabel { color: var(--muted); font-size: 12px; }
  #pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .gpill { font: inherit; font-size: 12px; font-weight: 600; padding: 3px 12px; border-radius: 999px;
           cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--muted); }
  .gpill.addg { color: var(--muted); }
  .gpill:disabled { opacity: .4; cursor: default; }
  .cbclear { margin-left: auto; font: inherit; font-size: 12px; background: none; border: none;
             color: var(--muted); cursor: pointer; }
  .cbclear:hover { color: var(--fg); text-decoration: underline; }
  .brest { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  #list.cmp .item:hover { background: var(--activeTint, var(--hover)); }   /* hover tint hints the active group */

  .cmp-head { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .cmp-legend { margin-top: 8px; color: var(--faint); font-size: 11px; display: flex; gap: 18px; flex-wrap: wrap; }
  .cmp-legend .sw { display: inline-block; width: 16px; height: 2px; vertical-align: middle; margin-right: 6px; }
  .cmp-table { margin-top: 22px; border-collapse: collapse; }
  .cmp-table th, .cmp-table td { text-align: left; padding: 7px 30px 7px 0; }
  .cmp-table thead th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .cmp-table td.k { font-size: 11px; color: var(--muted); }
  .cmp-table td.v { font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<!-- Load state -->
<div id="drop">
  <div id="dropbox">
    <h1>robometrics viewer</h1>
    <p>Drop a <code>report.json</code> here, or choose a file.</p>
    <p style="color:var(--faint)">Reads the JSON format documented in FORMAT.md.
      Runs entirely in the browser &mdash; no server, nothing leaves this page.</p>
    <p style="margin-top:16px"><label class="btn">choose file<input id="file" type="file" accept="application/json,.json" hidden></label></p>
    <div id="err"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <header>
    <div class="stats" id="summary"></div>
    <div class="meta" id="robotmeta"></div>
    <label class="btn load">load&hellip;<input id="file2" type="file" accept="application/json,.json" hidden></label>
  </header>
  <main>
    <div id="left">
      <div class="controls" id="singleControls">
        <input id="search" type="search" placeholder="dexterity: worst   ·   efficiency: best   ·   free text">
        <div id="count"></div>
      </div>
      <div id="compareBar" hidden>
        <div class="cbrow">
          <span class="cblabel">add to</span>
          <span id="pills"></span>
          <button class="gpill addg" id="addGroup" title="add another group">+</button>
          <button class="cbclear" id="clearGroups">clear</button>
        </div>
        <label class="brest"><input type="checkbox" id="groupRest"> + rest (everything else)</label>
        <div class="hint" id="cbhint"></div>
      </div>
      <div id="list"></div>
    </div>
    <div id="right">
      <div id="actionbar">
        <button id="compareBtn" class="btn" type="button">compare</button>
        <span class="hint" id="compareHint"></span>
      </div>
      <div id="detail"></div>
    </div>
  </main>
</div>

<script>
"use strict";

const TOP_N = 50;
const CHUNK = 50;   // list rows rendered per page; more are appended on scroll

const state = {
  report: null,
  query: "dexterity: worst",
  selected: null,      // original index into report.rollouts, or null
  visible: [],         // full sorted+filtered list; only `rendered` rows are in the DOM
  rendered: 0,
  sortKey: "dexterity_min",
  sortDir: "worst",
  smooth: false,       // smooth (non-snapping) crosshair
  chart: null,         // { prof, thr, n, maxV, worstAt, worstVal, spans, view, geom }
  drag: null,          // { active, startX, startView }
  box: null,           // shift-drag box-zoom { active, startX, curX }
  mode: "single",      // "single" | "compare"
  groups: [],          // compare groups: [{ set: Set(rollout indices), color }]
  activeGroup: 0,      // index of the group a list click adds to
  gRest: false,        // also compare against a computed "rest" group (everything unassigned)
  lastPos: null,       // last-clicked position in the visible list, for shift-range
};

// Distinct colors per group; the "rest" group is neutral grey.
const GROUP_PALETTE = ["#1a73e8", "#e8710a", "#1e8e3e", "#a142f4", "#d93025", "#12a4af"];
const REST_COLOR = "#9aa0a6";
const groupLabel = i => String.fromCharCode(65 + i);   // 0->A, 1->B, ...
function newGroups(n) { return Array.from({ length: n }, (_, i) => ({ set: new Set(), color: GROUP_PALETTE[i % GROUP_PALETTE.length] })); }

// ---- pure helpers (no DOM) -------------------------------------------------

function fmt(x, p) {
  if (x === null || x === undefined) return "—";
  if (typeof x !== "number") return String(x);
  if (!isFinite(x)) return "—";
  return String(Number(x.toPrecision(p || 4)));
}
function fmtBool(b) { return b === true ? "yes" : b === false ? "no" : "—"; }

// Parse the search box into a sort directive plus free text. `field: worst|best`
// sets the sort; anything left over filters file/task. Free text alone keeps the
// default worst-dexterity order.
function parseQuery(q) {
  q = q || "";
  let sortKey = "dexterity_min", dir = "worst", text = q;
  const m = q.match(/\b(dexterity|dex|efficiency|eff|performance|perf)\s*:\s*(worst|best)\b/i);
  if (m) {
    sortKey = m[1].toLowerCase().indexOf("eff") === 0 ? "efficiency" : "dexterity_min";
    dir = m[2].toLowerCase();
    text = (q.slice(0, m.index) + " " + q.slice(m.index + m[0].length)).trim();
  }
  return { sortKey, dir, text };
}

// worst = ascending (smallest first), best = descending; null always last.
function makeCompare(sortKey, dir) {
  return (a, b) => {
    const av = a[sortKey], bv = b[sortKey];
    const an = (av === null || av === undefined), bn = (bv === null || bv === undefined);
    if (an && bn) return String(a.file).localeCompare(String(b.file));
    if (an) return 1;
    if (bn) return -1;
    return dir === "best" ? bv - av : av - bv;
  };
}

// The whole sorted + filtered list (every match). The DOM only holds a chunk of
// it at a time -- see buildList / appendMore.
function allRollouts(report, query) {
  const { sortKey, dir, text } = parseQuery(query);
  const q = text.trim().toLowerCase();
  let list = report.rollouts.map((r, i) => Object.assign({ __i: i }, r));
  if (q) list = list.filter(r =>
    String(r.file).toLowerCase().includes(q) || String(r.task).toLowerCase().includes(q));
  list.sort(makeCompare(sortKey, dir));
  return { list, sortKey, dir };
}

function visibleRollouts(report, query) {
  const { list, sortKey, dir } = allRollouts(report, query);
  return { shown: list.slice(0, TOP_N), total: list.length, sortKey, dir };
}

// ---- compare: pure helpers -------------------------------------------------

function median(xs) {
  const a = xs.filter(x => x !== null && x !== undefined && isFinite(x)).slice().sort((x, y) => x - y);
  if (!a.length) return null;
  const m = a.length >> 1;
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}

// Smallest "nice" axis max >= x (1/2/2.5/5 x 10^n), so ticks land on round numbers.
function niceCeil(x) {
  if (!(x > 0)) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(x))), f = x / e;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
}

// Rollouts whose file or task contains the (lower-cased) filter text.
function matchGroup(report, text) {
  const q = (text || "").trim().toLowerCase();
  if (!q) return [];
  return report.rollouts.filter(r =>
    String(r.file).toLowerCase().includes(q) || String(r.task).toLowerCase().includes(q));
}

// Resample a profile to N points over normalised progress [0,1] -- rollouts have
// different lengths, so they can only be overlaid on a common x axis.
function resample(prof, N) {
  if (!prof || !prof.length) return null;
  if (prof.length === 1) return new Array(N).fill(prof[0]);
  const out = new Array(N);
  for (let k = 0; k < N; k++) {
    const x = (k / (N - 1)) * (prof.length - 1);
    const i = Math.floor(x), f = x - i;
    out[k] = i + 1 < prof.length ? prof[i] * (1 - f) + prof[i + 1] * f : prof[i];
  }
  return out;
}

// Per-group resampled individual curves and their pointwise mean.
function meanCurve(group, N) {
  const curves = group.map(r => resample(r.profile, N)).filter(Boolean);
  if (!curves.length) return { mean: null, curves: [] };
  const mean = new Array(N).fill(0);
  for (const c of curves) for (let k = 0; k < N; k++) mean[k] += c[k];
  for (let k = 0; k < N; k++) mean[k] /= curves.length;
  return { mean, curves };
}

function groupStats(group) {
  return {
    count: group.length,
    withProfile: group.filter(r => r.profile && r.profile.length).length,
    dexMedian: median(group.map(r => r.dexterity_min)),
    effMedian: median(group.filter(r => r.efficiency_status === "available").map(r => r.efficiency)),
  };
}

// ---- DOM -------------------------------------------------------------------

const $ = id => document.getElementById(id);
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderSummary() {
  const s = state.report.summary || {};
  const cells = [
    ["rollouts", fmt(s.num_rollouts, 6)],
    ["dexterity median", fmt(s.dexterity_median)],
    ["dexterity p05", fmt(s.dexterity_p05)],
    ["dexterity min", fmt(s.dexterity_min)],
    ["efficiency median", fmt(s.efficiency_median)],
    ["rollouts w/ span", fmt(s.rollouts_with_span, 6)],
  ];
  $("summary").innerHTML = cells.map(c =>
    '<div class="stat"><span class="v num">' + c[1] + '</span><span class="k">' + c[0] + "</span></div>").join("");

  const r = state.report.robot || {}, pr = state.report.params || {};
  const bits = [];
  if (r.urdf) bits.push(esc(r.urdf));
  if (r.num_dofs != null) bits.push(r.num_dofs + " dof");
  if (r.characteristic_length != null) bits.push("L=" + fmt(r.characteristic_length) + " m");
  if (pr.threshold_normalized != null) bits.push("thr=" + fmt(pr.threshold_normalized));
  if (pr.tip) bits.push("tip=" + esc(pr.tip));
  $("robotmeta").innerHTML = bits.join(" &middot; ");
}

function rowHTML(r) {
  const flagged = r.spans && r.spans.length > 0;
  const right = state.sortKey === "efficiency"
    ? (r.efficiency_status === "available" ? fmt(r.efficiency) : "n/a")
    : fmt(r.dexterity_min);
  const cmp = state.mode === "compare";
  const g = cmp ? groupOf(r.__i) : -1;
  const bar = g >= 0 ? ' style="box-shadow:inset 3px 0 0 ' + state.groups[g].color + '"' : '';
  return '<div class="item' +
    (!cmp && r.__i === state.selected ? " sel" : "") +
    (flagged ? " flagged" : "") +
    '" data-i="' + r.__i + '"' + bar + '><span class="name" title="' + esc(r.file) + '">' + esc(r.file) +
    '</span><span class="num">' + right + "</span></div>";
}

// The list holds the full sorted set in state.visible, but only `rendered` rows
// live in the DOM. Scrolling near the bottom appends the next CHUNK, so every
// rollout is reachable without ever building 500 rows at once.
function buildList() {
  const listEl = $("list");
  const { list, sortKey, dir } = allRollouts(state.report, state.query);
  state.visible = list;
  state.sortKey = sortKey;
  state.sortDir = dir;
  state.lastPos = null;   // the shift-range anchor is a position in the old list; invalidate it

  if (!list.length) {
    listEl.innerHTML = '<div class="empty-list">' +
      (state.report.rollouts.length === 0 ? "no rollouts in this report" : "nothing matches the search") + "</div>";
    state.rendered = 0; updateCount();
    return;
  }
  state.rendered = Math.min(CHUNK, list.length);
  listEl.scrollTop = 0;
  listEl.innerHTML = list.slice(0, state.rendered).map(rowHTML).join("");
  updateCount();
  fillViewport();
}

function appendMore() {
  const total = state.visible.length;
  if (state.rendered >= total) return;
  const next = Math.min(state.rendered + CHUNK, total);
  $("list").insertAdjacentHTML("beforeend", state.visible.slice(state.rendered, next).map(rowHTML).join(""));
  state.rendered = next;
  updateCount();
}

// Render up to (and including) a position, so keyboard nav can reach a row past
// the current chunk before scrolling to it.
function ensureRendered(pos) {
  while (state.rendered <= pos && state.rendered < state.visible.length) appendMore();
}

// Keep enough rows in the DOM to overflow the list, so there is always room to
// scroll (a tall viewport or a short chunk would otherwise never trigger a load).
function fillViewport() {
  const el = $("list");
  let guard = 0;
  while (state.rendered < state.visible.length && el.scrollHeight <= el.clientHeight + 300 && guard++ < 60) appendMore();
}

function updateCount() {
  const total = state.visible.length;   // stays stable as chunks stream in -- the paging is invisible
  $("count").textContent = total
    ? total + " rollouts · " + (state.sortKey === "efficiency" ? "efficiency" : "dexterity") + " " + state.sortDir + " first"
    : "";
}

function markSelection() {
  const cur = $("list").querySelector(".item.sel");
  if (cur) cur.classList.remove("sel");
  if (state.selected !== null) {
    const next = $("list").querySelector('.item[data-i="' + state.selected + '"]');
    if (next) next.classList.add("sel");
  }
}

// ---- detail + zoomable chart ----------------------------------------------

function renderDetail() {
  const el = $("detail");
  state.chart = null;
  if (state.selected === null) {
    el.innerHTML = '<div class="empty">' +
      (state.report.rollouts.length === 0 ? "no rollouts in this report" : "select a rollout on the left") + "</div>";
    return;
  }
  const r = state.report.rollouts[state.selected];
  const thr = (state.report.params || {}).threshold_normalized;

  let effHtml;
  if (r.efficiency_status !== "available") effHtml = '<span class="v reason">N/A &middot; ' + esc(r.efficiency_status) + "</span>";
  else if (r.efficiency == null) effHtml = '<span class="v na">—</span>';
  else effHtml = '<span class="v num">' + fmt(r.efficiency) + "</span>";

  const spanNote = (r.spans && r.spans.length)
    ? '<div class="spanlist">low-dexterity spans: ' +
        r.spans.map(s => "[" + s.begin + ".." + (s.end - 1) + "] worst " + fmt(s.worst)).join(", ") + "</div>"
    : "";

  const hasProfile = r.profile && r.profile.length;
  const chartHtml = hasProfile
    ? chartWrapHTML() +
      '<div class="charthelp">scroll or shift-drag to zoom · drag pan · ←→ move · 0 reset</div>'
    : (r.profile === null
        ? '<div class="empty">profiles not embedded in this file &mdash; re-run without <code>--profiles none</code> to see the curve</div>'
        : '<div class="empty">no steps recorded in this rollout</div>');

  el.innerHTML =
    "<h2>" + esc(r.file) + "</h2>" +
    '<div class="sub">task: ' + esc(r.task) + "</div>" +
    chartHtml +
    '<div class="infopanel"><div class="fields">' +
      '<div class="field"><span class="k">dexterity min</span><span class="v num' + (r.dexterity_min == null ? " na" : "") + '">' + fmt(r.dexterity_min) + "</span></div>" +
      '<div class="field"><span class="k">efficiency</span>' + effHtml + "</div>" +
      '<div class="field"><span class="k">steps</span><span class="v num">' + fmt(r.steps, 6) + "</span></div>" +
      '<div class="field"><span class="k">success</span><span class="v' + (r.success == null ? " na" : "") + '">' + fmtBool(r.success) + "</span></div>" +
      '<div class="field"><span class="k">spans</span><span class="v num">' + (r.spans ? r.spans.length : 0) + "</span></div>" +
    "</div>" + spanNote + "</div>";

  if (hasProfile) {
    state.chart = {
      kind: "single",
      series: [{ color: "#7d8794", values: r.profile }],
      n: r.profile.length, thr,
      extras: { worstAt: r.dexterity_worst_at, worstVal: r.dexterity_min, spans: r.spans || [] },
      view: { i0: 0, i1: Math.max(1, r.profile.length - 1) },
      cursor: null, show: [true],
    };
    wireChart(); drawChart();
  }
}

// ===========================================================================
// Chart engine -- one shared implementation for the single profile and the two
// compare means. A chart is: { kind, series:[{color,values}], n, thr,
// extras:{worstAt,worstVal,spans}, view:{i0,i1}, cursor, show:[] }.
// ===========================================================================

// The chart's DOM: an <svg> (focusable), the tooltip, and a hover-reveal tools
// row. Reused by both modes; rebuilt each render, so handlers die with the node.
function chartWrapHTML() {
  return '<div class="chart-wrap">' +
    '<svg id="chart" class="chart num" tabindex="0" viewBox="0 0 820 300" preserveAspectRatio="xMidYMid meet"></svg>' +
    '<div id="chartTip" hidden></div>' +
    '<div class="chart-tools" id="chartTools">' +
      '<span data-act="glide" title="smooth crosshair — read values between steps, not snapped">∿ smooth</span>' +
      '<span data-act="copy" title="copy the visible data to the clipboard as CSV">copy</span>' +
      '<span data-act="csv" title="download the visible data as a CSV file">download</span>' +
      '<span data-act="svg" title="download the chart as SVG">svg</span>' +
      '<span data-act="png" title="download the chart as PNG">png</span>' +
      '<span data-act="reset" title="reset zoom (key: 0, or double-click)">reset</span>' +
      '<span id="toolMsg" class="toolmsg"></span></div>' +
    "</div>";
}

function clampView(i0, i1, n) {
  const maxIdx = n - 1;
  let w = i1 - i0;
  if (w < 2) w = 2;
  if (w > maxIdx) w = maxIdx;
  if (i0 < 0) { i0 = 0; i1 = i0 + w; }
  if (i1 > maxIdx) { i1 = maxIdx; i0 = i1 - w; }
  if (i0 < 0) i0 = 0;
  return { i0, i1 };
}

// y-axis max over the whole series -- fixed regardless of x-zoom, nicely rounded,
// so the side numbers always match the true scale.
function chartYMax(c) {
  let m = 0;
  c.series.forEach((s, idx) => {
    if (c.show[idx] === false) return;
    for (let k = 0; k < c.n; k++) { const v = s.values[k]; if (v != null && isFinite(v) && v > m) m = v; }
  });
  if (typeof c.thr === "number" && isFinite(c.thr)) m = Math.max(m, c.thr);
  return niceCeil((m > 0 ? m : 1) * 1.02);
}

function xTick(c, idx) {
  return c.kind === "single" ? String(Math.round(idx)) : (idx / (c.n - 1)).toFixed(2);
}

// A <style> embedded in the SVG so an exported/copied SVG keeps its look without
// the page stylesheet. Line colours/widths are inline on each element.
const CHART_CSS =
  ".grid{stroke:#ecedf0;stroke-width:1}.axis-label{fill:#b0b6bd;font:10px -apple-system,Arial,sans-serif}" +
  ".ln{fill:none}.thr{stroke:#b6bbc2;stroke-width:1;stroke-dasharray:5 4}" +
  ".wp{fill:#d93025;stroke:#fff;stroke-width:1}.sp{fill:rgba(217,48,37,.06)}" +
  ".cl{stroke:#cbd0d6;stroke-width:1;stroke-dasharray:3 3}";

function drawChart() {
  const c = state.chart; if (!c) return;
  const svg = $("chart"); if (!svg) return;
  const W = 820, H = 300, padL = 48, padR = 16, padT = 14, padB = 26;
  const { i0, i1 } = c.view, maxV = chartYMax(c);
  const X = i => padL + ((i - i0) / ((i1 - i0) || 1)) * (W - padL - padR);
  const Y = v => padT + (1 - v / maxV) * (H - padT - padB);
  c.geom = { W, H, padL, padR, padT, padB, X, Y, maxV };

  const p = ["<style>" + CHART_CSS + "</style>"];
  p.push('<defs><clipPath id="plotclip"><rect x="' + padL + '" y="' + padT + '" width="' + (W - padL - padR) + '" height="' + (H - padT - padB) + '"/></clipPath></defs>');

  const NHZ = 4;
  for (let k = 0; k <= NHZ; k++) {
    const y = padT + (k / NHZ) * (H - padT - padB);
    p.push('<line class="grid" x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) + '"/>');
    p.push('<text class="axis-label" x="' + (padL - 6) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end">' + fmt(maxV * (1 - k / NHZ), 2) + "</text>");
  }
  const NVX = c.kind === "single" ? 6 : 4;
  for (let k = 0; k <= NVX; k++) {
    const x = padL + (k / NVX) * (W - padL - padR);
    p.push('<text class="axis-label" x="' + x.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + xTick(c, i0 + (k / NVX) * (i1 - i0)) + "</text>");
  }

  const clip = [];
  (c.extras.spans || []).forEach(s => {
    const x1 = X(s.begin), x2 = X(Math.max(s.begin, s.end - 1)), w = Math.max(2, x2 - x1);
    clip.push('<rect class="sp" x="' + x1.toFixed(1) + '" y="' + padT + '" width="' + w.toFixed(1) + '" height="' + (H - padT - padB) + '"/>');
  });
  if (typeof c.thr === "number" && isFinite(c.thr) && c.thr >= 0) {
    const ty = Y(c.thr);
    clip.push('<line class="thr" x1="' + padL + '" y1="' + ty.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + ty.toFixed(1) +
      '"><title>threshold ' + fmt(c.thr) + '</title></line>');
  }
  c.series.forEach((s, idx) => {
    if (c.show[idx] === false) return;
    clip.push('<polyline class="ln" stroke="' + s.color + '" stroke-width="' + (c.kind === "single" ? 1 : 1.2) +
      '" points="' + s.values.map((v, k) => X(k).toFixed(1) + "," + Y(v).toFixed(1)).join(" ") + '"/>');
  });
  const ex = c.extras;
  if (ex.worstAt != null && ex.worstVal != null && ex.worstAt >= i0 && ex.worstAt <= i1) {
    clip.push('<circle class="wp" cx="' + X(ex.worstAt).toFixed(1) + '" cy="' + Y(ex.worstVal).toFixed(1) +
      '" r="2.6"><title>worst step: min ' + fmt(ex.worstVal) + ' @ ' + ex.worstAt + '</title></circle>');
  }
  p.push('<g clip-path="url(#plotclip)">' + clip.join("") + "</g>");

  p.push('<rect id="zoomBox" x="0" y="' + padT + '" width="0" height="' + (H - padT - padB) +
    '" fill="rgba(26,115,232,.12)" stroke="#1a73e8" stroke-width="1" style="display:none"/>');
  p.push('<line id="crossLine" class="cl" x1="0" y1="0" x2="0" y2="0" style="display:none"/>');
  c.series.forEach((s, idx) => p.push('<circle id="crossDot' + idx + '" r="3" fill="' + s.color + '" stroke="#fff" style="display:none"/>'));
  svg.innerHTML = p.join("");

  if (c.cursor != null) showCursor(c.cursor);
}

// Linear interpolation, so the smooth crosshair reads a value between samples.
function valueAt(values, x) {
  const i = Math.floor(x), f = x - i;
  return i + 1 < values.length ? values[i] * (1 - f) + values[i + 1] * f : values[values.length - 1];
}

function tipHTML(c, x) {
  if (c.kind === "single") {
    const label = state.smooth ? x.toFixed(1) : String(Math.round(x));
    return "step " + label + " · " + fmt(valueAt(c.series[0].values, x));
  }
  return "progress " + (x / (c.n - 1)).toFixed(2) + c.series.map((s, idx) =>
    ' · <b style="color:' + s.color + '">' + s.label + "</b> " +
    (c.show[idx] === false ? "—" : fmt(valueAt(s.values, x)))).join("");
}

// x may be fractional; snapped to the nearest sample unless smooth ("glide") is on.
function showCursor(x) {
  const c = state.chart; if (!c || !c.geom) return;
  x = Math.max(0, Math.min(c.n - 1, state.smooth ? x : Math.round(x)));
  const g = c.geom, svg = $("chart"); if (!svg) return;
  const px = g.X(x), line = $("crossLine"); if (!line) return;
  line.setAttribute("x1", px); line.setAttribute("x2", px);
  line.setAttribute("y1", g.padT); line.setAttribute("y2", g.H - g.padB); line.style.display = "";
  c.series.forEach((s, idx) => {
    const dot = $("crossDot" + idx); if (!dot) return;
    if (c.show[idx] === false) { dot.style.display = "none"; return; }
    dot.setAttribute("cx", px); dot.setAttribute("cy", g.Y(valueAt(s.values, x))); dot.style.display = "";
  });
  const tip = $("chartTip");
  if (tip) {
    tip.hidden = false; tip.innerHTML = tipHTML(c, x);
    const rect = svg.getBoundingClientRect(), scale = rect.width / g.W || 1;
    tip.style.left = Math.max(0, Math.min(rect.width - tip.offsetWidth - 4, px * scale + 10)) + "px";
    tip.style.top = (g.padT * scale + 2) + "px";
  }
}

function hideCursor() {
  const line = $("crossLine"); if (line) line.style.display = "none";
  const c = state.chart; if (c) c.series.forEach((s, idx) => { const d = $("crossDot" + idx); if (d) d.style.display = "none"; });
  const tip = $("chartTip"); if (tip) tip.hidden = true;
}

function zoomAround(centerIdx, frac, factor) {
  const c = state.chart; if (!c) return;
  const w = (c.view.i1 - c.view.i0) * factor;
  c.view = clampView(centerIdx - frac * w, centerIdx - frac * w + w, c.n);
  drawChart();
}
function resetView() { const c = state.chart; if (c) { c.view = { i0: 0, i1: Math.max(1, c.n - 1) }; drawChart(); } }

function wireChart() {
  const svg = $("chart"); if (!svg) return;

  svg.addEventListener("wheel", e => {
    if (!state.chart) return;
    e.preventDefault();
    const g = state.chart.geom, v = state.chart.view, rect = svg.getBoundingClientRect();
    const sx = (e.clientX - rect.left) / (rect.width / g.W || 1);
    const frac = Math.max(0, Math.min(1, (sx - g.padL) / (g.W - g.padL - g.padR)));
    zoomAround(v.i0 + frac * (v.i1 - v.i0), frac, e.deltaY < 0 ? 0.85 : 1 / 0.85);
  }, { passive: false });

  svg.addEventListener("mousedown", e => {
    if (!state.chart) return;
    if (e.shiftKey) state.box = { active: true, startX: e.clientX, curX: e.clientX };
    else { state.drag = { active: true, startX: e.clientX, startView: Object.assign({}, state.chart.view) }; svg.classList.add("grabbing"); }
    e.preventDefault();
  });
  svg.addEventListener("dblclick", resetView);

  let pending = null, lastE = null;
  svg.addEventListener("mousemove", e => {
    if (!(state.box && state.box.active)) svg.style.cursor = e.shiftKey ? "crosshair" : "";
    if ((state.drag && state.drag.active) || (state.box && state.box.active)) return;
    lastE = e; if (pending) return;
    pending = requestAnimationFrame(() => {
      pending = null;
      const c = state.chart; if (!c || !c.geom) return;
      const g = c.geom, rect = svg.getBoundingClientRect(), scale = rect.width / g.W || 1;
      const frac = Math.max(0, Math.min(1, ((lastE.clientX - rect.left) / scale - g.padL) / (g.W - g.padL - g.padR)));
      showCursor(c.view.i0 + frac * (c.view.i1 - c.view.i0));
    });
  });
  svg.addEventListener("mouseleave", () => {
    if (pending) { cancelAnimationFrame(pending); pending = null; }
    if (state.chart && state.chart.cursor != null) showCursor(state.chart.cursor); else hideCursor();
  });

  // keyboard tools (chart must be focused; stopPropagation keeps list nav out)
  svg.addEventListener("keydown", e => {
    const c = state.chart; if (!c) return;
    const step = e.shiftKey ? 10 : 1;
    let handled = true;
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      const base = c.cursor == null ? Math.round((c.view.i0 + c.view.i1) / 2) : c.cursor;
      c.cursor = Math.max(0, Math.min(c.n - 1, base + (e.key === "ArrowRight" ? step : -step)));
      showCursor(c.cursor);
    } else if (e.key === "+" || e.key === "=") zoomAround((c.view.i0 + c.view.i1) / 2, 0.5, 0.8);
    else if (e.key === "-" || e.key === "_") zoomAround((c.view.i0 + c.view.i1) / 2, 0.5, 1 / 0.8);
    else if (e.key === "0") resetView();
    else if (e.key === "Home") { c.cursor = 0; showCursor(0); }
    else if (e.key === "End") { c.cursor = c.n - 1; showCursor(c.n - 1); }
    else if (e.key === "c" || e.key === "C") copyData();
    else handled = false;
    if (handled) { e.preventDefault(); e.stopPropagation(); }
  });

  // Reflect the persistent "smooth" mode on the freshly-rendered toolbar.
  const glideBtn = $("chartTools") && $("chartTools").querySelector('[data-act="glide"]');
  if (glideBtn) glideBtn.classList.toggle("on", state.smooth);
}

// ---- chart tools: copy visible data, export SVG/PNG ------------------------

function download(url, name) {
  const a = document.createElement("a"); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
function flashTool(msg) {
  const el = $("toolMsg"); if (!el) return;
  el.textContent = msg; el.style.opacity = "1";
  clearTimeout(flashTool._t); flashTool._t = setTimeout(() => { el.style.opacity = "0"; }, 1200);
}
// CSV of the currently visible window (single: step,dexterity; compare:
// progress,A,B). Hidden groups become blank columns.
function csvText() {
  const c = state.chart; if (!c) return "";
  const lo = Math.max(0, Math.ceil(c.view.i0)), hi = Math.min(c.n - 1, Math.floor(c.view.i1));
  const lines = [];
  if (c.kind === "single") {
    lines.push("step,dexterity");
    for (let i = lo; i <= hi; i++) lines.push(i + "," + c.series[0].values[i]);
  } else {
    lines.push("progress," + c.series.map(s => s.label).join(","));
    for (let i = lo; i <= hi; i++) lines.push((i / (c.n - 1)).toFixed(4) + "," +
      c.series.map((s, idx) => c.show[idx] === false ? "" : s.values[i]).join(","));
  }
  return lines.join("\n");
}
function copyData() {
  const text = csvText(); if (!text) return;
  const done = () => flashTool("copied");
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function downloadCSV() {
  const text = csvText(); if (!text) return;
  download("data:text/csv;charset=utf-8," + encodeURIComponent(text), "chart_data.csv");
  flashTool("csv");
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { flashTool("copy blocked"); }
  ta.remove();
}
function exportSVG() {
  const svg = $("chart"); if (!svg) return;
  const xml = new XMLSerializer().serializeToString(svg);
  download("data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml), "chart.svg");
  flashTool("svg");
}
function exportPNG() {
  const svg = $("chart"); if (!svg) return;
  const xml = new XMLSerializer().serializeToString(svg), img = new Image();
  img.onload = () => {
    const s = 2, cv = document.createElement("canvas"); cv.width = 820 * s; cv.height = 300 * s;
    const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.scale(s, s); ctx.drawImage(img, 0, 0, 820, 300);
    try { download(cv.toDataURL("image/png"), "chart.png"); flashTool("png"); } catch (e) { flashTool("png blocked"); }
  };
  img.onerror = () => flashTool("png failed");
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
}

function setSelected(i) {
  state.selected = i;
  markSelection();
  renderDetail();
}

let listScheduled = false;
function scheduleList() {
  if (listScheduled) return;
  listScheduled = true;
  requestAnimationFrame(() => {
    listScheduled = false; buildList();
    if (state.mode === "compare") markGroups(); else markSelection();
  });
}

// ---- compare mode ----------------------------------------------------------

function setMode(mode) {
  state.mode = mode;
  const cmp = mode === "compare";
  if (cmp && !state.groups.length) state.groups = newGroups(2);   // start with A and B
  $("compareBar").hidden = !cmp;
  $("compareBtn").classList.toggle("active", cmp);
  $("compareHint").textContent = cmp ? "click rollouts to build groups — compare again to exit" : "";
  $("list").classList.toggle("cmp", cmp);
  buildList();                       // list stays visible; membership styling differs by mode
  if (cmp) renderCompare();
  else markSelection(), renderDetail();
}

// Index of the group a rollout is in, or -1.
function groupOf(i) {
  for (let k = 0; k < state.groups.length; k++) if (state.groups[k].set.has(i)) return k;
  return -1;
}

// Every group (user groups + the optional "rest") as { label, color, rollouts }.
function activeGroups() {
  const rs = state.report.rollouts;
  const out = state.groups.map((g, i) => ({ label: groupLabel(i), color: g.color, rollouts: [...g.set].map(idx => rs[idx]) }));
  if (state.gRest) {
    const inAny = new Set();
    state.groups.forEach(g => g.set.forEach(idx => inAny.add(idx)));
    out.push({ label: "rest", color: REST_COLOR, rollouts: rs.filter((r, i) => !inAny.has(i)) });
  }
  return out;
}

function assignActive(i, add) {   // add=true never toggles off (used for shift-range)
  const active = state.groups[state.activeGroup].set;
  if (!add && active.has(i)) { active.delete(i); return; }
  state.groups.forEach((g, k) => { if (k !== state.activeGroup) g.set.delete(i); });   // groups are exclusive
  active.add(i);
}

function updatePills() {
  const active = state.activeGroup;
  $("pills").innerHTML = state.groups.map((g, i) => {
    const on = i === active;
    const style = on ? "background:" + g.color + ";border-color:" + g.color + ";color:#fff"
                     : "border-color:" + g.color + ";color:" + g.color;
    return '<button class="gpill" data-g="' + i + '" style="' + style + '">' + groupLabel(i) + " · " + g.set.size + "</button>";
  }).join("");
  $("addGroup").disabled = state.groups.length >= GROUP_PALETTE.length;
  $("cbhint").textContent = "click a rollout to add it to " + groupLabel(active) +
    " · click again to remove · shift-click a range";
  $("list").style.setProperty("--activeTint", state.groups[active].color + "20");   // ~12% alpha hover tint
}

function markGroups() {
  $("list").querySelectorAll(".item").forEach(el => {
    const g = groupOf(Number(el.dataset.i));
    el.style.boxShadow = g >= 0 ? "inset 3px 0 0 " + state.groups[g].color : "";
  });
}

function renderCompare() {
  updatePills();
  markGroups();
  const el = $("detail");
  const groups = activeGroups().filter(g => g.rollouts.length > 0);

  if (groups.length < 2) {
    el.innerHTML = '<div class="empty">pick rollouts for at least two groups — the pills above choose which group a click adds to</div>';
    state.chart = null;
    return;
  }

  const N = 100;
  const thr = (state.report.params || {}).threshold_normalized;
  const series = groups.map(g => {
    const mc = meanCurve(g.rollouts, N), stats = groupStats(g.rollouts);
    return { label: g.label, color: g.color, values: mc.mean || new Array(N).fill(0), avail: mc.mean != null, stats, count: g.rollouts.length };
  });
  const noProf = series.filter(s => !s.avail).map(s => s.label);
  const caption = noProf.length
    ? "no embedded profiles for group " + noProf.join(", ") + " — curve omitted"
    : "mean dexterity over normalised progress (0 start → 1 end)";

  el.innerHTML =
    '<div class="cmp-head">' + series.map((s, i) =>
      '<b class="tgl' + (s.avail ? "" : " off") + '" data-series="' + i + '" style="color:' + s.color + '">' + s.label + "</b> " + s.count + " rollouts"
    ).join(" · ") + "</div>" +
    chartWrapHTML() +
    '<div class="charthelp">scroll or shift-drag to zoom · drag pan · ←→ move · 0 reset · click a letter to toggle it</div>' +
    '<div class="cmp-legend">' + caption + "</div>" +
    compareSummary(series);

  state.chart = {
    kind: "compare",
    series: series.map(s => ({ color: s.color, values: s.values, label: s.label })),
    n: N, thr, extras: {}, view: { i0: 0, i1: N - 1 },
    cursor: null, show: series.map(s => s.avail), avail: series.map(s => s.avail),
  };
  wireChart(); drawChart();
}

function compareSummary(series) {
  const head = series.map(s => '<th style="color:' + s.color + '">' + s.label + "</th>").join("");
  const row = (label, vals) => '<tr><td class="k">' + label + "</td>" + vals.map(v => '<td class="v">' + v + "</td>").join("") + "</tr>";
  return '<table class="cmp-table"><thead><tr><th></th>' + head + "</tr></thead><tbody>" +
    row("dexterity median", series.map(s => fmt(s.stats.dexMedian))) +
    row("efficiency median", series.map(s => fmt(s.stats.effMedian))) +
    "</tbody></table>";
}

// ---- loading ---------------------------------------------------------------

function showError(msg) { $("err").textContent = msg; }

function loadText(text) {
  let data;
  try { data = JSON.parse(text); }
  catch (e) { showError("Not valid JSON: " + e.message); return; }
  if (!data || typeof data !== "object" || !Array.isArray(data.rollouts)) {
    showError('Not a robometrics report: no "rollouts" array. See FORMAT.md.'); return;
  }
  state.report = data; state.selected = null;
  state.mode = "single"; state.groups = []; state.activeGroup = 0; state.gRest = false; state.lastPos = null;
  $("compareBar").hidden = true; $("compareBtn").classList.remove("active"); $("compareHint").textContent = "";
  $("groupRest").checked = false; $("list").classList.remove("cmp");
  showError("");
  $("drop").classList.add("hidden"); $("app").classList.add("shown");

  renderSummary();
  buildList();
  renderDetail();
  if (state.visible.length) setSelected(state.visible[0].__i);
}

function loadFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => loadText(String(reader.result));
  reader.onerror = () => showError("Could not read the file.");
  reader.readAsText(file);
}

// ---- wiring ----------------------------------------------------------------

function init() {
  $("search").value = state.query;
  $("file").addEventListener("change", e => loadFile(e.target.files[0]));
  $("file2").addEventListener("change", e => loadFile(e.target.files[0]));
  $("search").addEventListener("input", e => { state.query = e.target.value; scheduleList(); });

  $("list").addEventListener("click", e => {
    const item = e.target.closest(".item");
    if (!item) return;
    const i = Number(item.dataset.i);
    if (state.mode !== "compare") { setSelected(i); return; }
    const pos = state.visible.findIndex(r => r.__i === i);
    if (e.shiftKey && state.lastPos != null) {
      const [a, b] = [state.lastPos, pos].sort((x, y) => x - y);
      for (let k = a; k <= b; k++) { const rr = state.visible[k]; if (rr) assignActive(rr.__i, true); }
    } else {
      assignActive(i, false);
    }
    state.lastPos = pos;
    renderCompare();
  });

  $("compareBtn").addEventListener("click", () => setMode(state.mode === "compare" ? "single" : "compare"));
  $("pills").addEventListener("click", e => {
    const p = e.target.closest("[data-g]"); if (!p) return;
    state.activeGroup = Number(p.dataset.g); state.lastPos = null; updatePills();
  });
  $("addGroup").addEventListener("click", () => {
    if (state.groups.length >= GROUP_PALETTE.length) return;
    state.groups.push({ set: new Set(), color: GROUP_PALETTE[state.groups.length % GROUP_PALETTE.length] });
    state.activeGroup = state.groups.length - 1; state.lastPos = null;
    updatePills();
  });
  $("clearGroups").addEventListener("click", () => {
    state.groups = newGroups(2); state.activeGroup = 0; state.gRest = false;
    $("groupRest").checked = false; state.lastPos = null;
    markGroups(); renderCompare();
  });
  $("groupRest").addEventListener("change", e => { state.gRest = e.target.checked; renderCompare(); });

  document.addEventListener("keydown", e => {
    if (!state.report || state.mode === "compare" || (e.key !== "ArrowDown" && e.key !== "ArrowUp")) return;
    const ae = document.activeElement;
    if (ae && (ae.id === "chart" || /^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(ae.tagName))) return;
    if (!state.visible.length) return;
    let pos = state.visible.findIndex(r => r.__i === state.selected);
    pos = e.key === "ArrowDown" ? Math.min(state.visible.length - 1, pos + 1) : Math.max(0, pos - 1);
    e.preventDefault();
    ensureRendered(pos);   // the target may be past the current chunk
    setSelected(state.visible[pos].__i);
    const sel = $("list").querySelector(".item.sel");
    if (sel) sel.scrollIntoView({ block: "nearest" });
  });

  // Infinite scroll: append the next chunk as the list nears the bottom.
  $("list").addEventListener("scroll", () => {
    const el = $("list");
    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 300) appendMore();
  });

  // Chart tools (copy/svg/png/reset) and the compare A/B series toggle, delegated.
  $("detail").addEventListener("click", e => {
    const act = e.target.closest("[data-act]");
    if (act) {
      const a = act.dataset.act;
      if (a === "copy") copyData();
      else if (a === "csv") downloadCSV();
      else if (a === "svg") exportSVG();
      else if (a === "png") exportPNG();
      else if (a === "glide") { state.smooth = !state.smooth; act.classList.toggle("on", state.smooth); flashTool(state.smooth ? "smooth on" : "smooth off"); if (state.chart && state.chart.cursor != null) showCursor(state.chart.cursor); }
      else if (a === "reset") resetView();
      return;
    }
    const tg = e.target.closest("[data-series]");
    if (tg && state.chart && state.chart.kind === "compare") {
      const idx = Number(tg.dataset.series);
      if (state.chart.avail && !state.chart.avail[idx]) return;   // no data for this group
      state.chart.show[idx] = state.chart.show[idx] === false;
      tg.classList.toggle("off", state.chart.show[idx] === false);
      drawChart();
    }
  });

  // Chart pan / box-zoom: window-level so a drag that leaves the SVG keeps working.
  window.addEventListener("mousemove", e => {
    if (state.box && state.box.active && state.chart) {
      state.box.curX = e.clientX;
      const g = state.chart.geom, svg = $("chart"); if (!svg) return;
      const rect = svg.getBoundingClientRect(), scale = rect.width / g.W || 1;
      const sx0 = (state.box.startX - rect.left) / scale, sx1 = (e.clientX - rect.left) / scale;
      const lo = Math.max(g.padL, Math.min(sx0, sx1)), hi = Math.min(g.W - g.padR, Math.max(sx0, sx1));
      const bx = $("zoomBox");
      if (bx) { bx.setAttribute("x", lo.toFixed(1)); bx.setAttribute("width", Math.max(0, hi - lo).toFixed(1)); bx.style.display = ""; }
      return;
    }
    if (!state.drag || !state.drag.active || !state.chart) return;
    const g = state.chart.geom, sv = state.drag.startView;
    const svg = $("chart"); if (!svg) return;
    const rect = svg.getBoundingClientRect();
    const scale = rect.width / g.W || 1;
    const dPx = (e.clientX - state.drag.startX) / scale;
    const perIdx = (g.W - g.padL - g.padR) / ((sv.i1 - sv.i0) || 1);
    const dIdx = dPx / perIdx;
    state.chart.view = clampView(sv.i0 - dIdx, sv.i1 - dIdx, state.chart.n);
    drawChart();
  });
  window.addEventListener("mouseup", () => {
    if (state.box && state.box.active && state.chart) {
      state.box.active = false;
      const g = state.chart.geom, svg = $("chart");
      if (svg) {
        const rect = svg.getBoundingClientRect(), scale = rect.width / g.W || 1;
        const sx0 = (state.box.startX - rect.left) / scale, sx1 = (state.box.curX - rect.left) / scale;
        if (Math.abs(sx1 - sx0) > 4) {   // a real drag, not a shift-click
          const v = state.chart.view;
          const toIdx = sx => v.i0 + Math.max(0, Math.min(1, (sx - g.padL) / (g.W - g.padL - g.padR))) * (v.i1 - v.i0);
          state.chart.view = clampView(Math.min(toIdx(sx0), toIdx(sx1)), Math.max(toIdx(sx0), toIdx(sx1)), state.chart.n);
          drawChart();
        } else { const bx = $("zoomBox"); if (bx) bx.style.display = "none"; }
      }
      return;
    }
    if (state.drag) state.drag.active = false;
    const svg = $("chart"); if (svg) svg.classList.remove("grabbing");
  });

  ["dragover", "dragenter"].forEach(ev =>
    document.addEventListener(ev, e => { e.preventDefault(); document.body.classList.add("dragover"); }));
  document.addEventListener("dragleave", e => { if (e.target === document.body) document.body.classList.remove("dragover"); });
  document.addEventListener("drop", e => {
    e.preventDefault(); document.body.classList.remove("dragover");
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });
}

if (typeof document !== "undefined") {
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
}

// Exposed for offline logic tests; harmless in the browser.
if (typeof module !== "undefined" && module.exports) {
  module.exports = { fmt, fmtBool, parseQuery, makeCompare, visibleRollouts, median, matchGroup, resample, meanCurve, groupStats };
}
</script>
